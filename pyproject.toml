[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-pi-manager-integration"
version = "0.2.0"
description = "Secure SSH-based Raspberry Pi and Debian host management for Home Assistant"
requires-python = ">=3.13"
dependencies = ["asyncssh>=2.20.0"]

[project.optional-dependencies]
test = [
  "homeassistant>=2026.5,<2027",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = false
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.setuptools]
packages = []
