name: Integration CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  remote-helper-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile remote helper sources
        run: |
          python - <<'PY'
          from pathlib import Path

          remote_dir = Path("custom_components/pi_manager/remote")
          for filename in ("pi_manager_agent.py", "pi-managerctl"):
              path = remote_dir / filename
              compile(path.read_text(encoding="utf-8"), path.as_posix(), "exec")
              print(f"Python 3.13 compile PASS: {path}")

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest tests -q
      - name: Format check
        run: ruff format --check custom_components tests
      - name: Lint
        run: ruff check custom_components tests
      - name: Type check
        run: mypy custom_components
      - name: Compile
        run: python -m compileall custom_components
      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: integration
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
