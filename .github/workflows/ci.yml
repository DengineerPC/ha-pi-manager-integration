name: Integration CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest tests -q
      - name: Format check
        run: ruff format --check custom_components tests
      - name: Lint
        run: ruff check custom_components tests
      - name: Type check
        run: mypy custom_components
      - name: Compile
        run: python -m compileall custom_components
      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: integration
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
